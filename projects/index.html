<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <!-- Responsive Design -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="JobFinder - Find the best jobs and internships from top companies.">

    <title>JobFinder | Find Your Dream Job</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />



</head>

<body>
    <header class="header">
        <nav class="navbar container">
            <!-- Logo -->
            <a href="" class="logo">
                <span class="logo-icon">J</span>
                <span>JobFinder</span>
            </a>
             
            <ul class="nav-links">

                <li>
                    <a href="index.html" class="active">Home</a>
                </li>

                <li>
                    <a href="jobs.html">Jobs</a>
                </li>

                <li>
                    <a href="#">Companies</a>
                </li>

                <li>
                    <a href="#">Blog</a>
                </li>

            </ul>

            <!-- Navbar Actions -->
            <div class="nav-actions">

                <a href="login.html" class="login-btn">
                    Login
                </a>

                <a href="register.html" class="register-btn">
                    Register
                </a>

                <button
                    class="theme-btn"
                    id="themeBtn"
                    aria-label="Toggle dark mode">
                    c
                </button>

            </div>
        </nav>

    </header>

    <main>
        <!--   HERO SECTION  -->
        <section class="hero">

            <div class="container hero-content">

                <!-- Hero Text -->
                <div class="hero-text">

                    <span class="hero-subtitle">
                        Your Career Starts Here
                    </span>

                    <h1>
                        Find Your Dream
                        <span>Internship or Job</span>
                    </h1>

                    <p>
                        Explore thousands of internships and job
                        opportunities from top companies. Build your
                        future with JobFinder.
                    </p>

                </div>
                 <!-- Hero Illustration -->
                <div class="hero-image">

                    <div class="hero-illustration">
                        👨‍💻
                    </div>

                </div>

            </div>
            
            <!--  SEARCH BOX   -->
            <div class="container">

                <form class="search-box" id="searchForm">

                    <!-- Job Search -->
                    <div class="search-field">

                        <span class="search-icon">
                            <i class="fa-solid fa-magnifying-glass" ></i>
                         </span>

                        <div>
                            <label for="jobSearch">
                                Search
                            </label>

                            <input
                                type="text"
                                id="jobSearch"
                                name="job"
                                placeholder="Job title, skills or company">
                        </div>

                    </div>


                    <!-- Location -->
                    <div class="search-field">

                        <span class="search-icon">
                            📍
                        </span>

                        <div>
                            <label for="location">
                                Location
                            </label>

                            <input
                                type="text"
                                id="location"
                                name="location"
                                placeholder="City or remote">
                        </div>

                    </div>


                    <!-- Job Type -->
                    <div class="search-field">

                        <span class="search-icon">
                            💼
                        </span>

                        <div>
                            <label for="jobType">
                                Job Type
                            </label>

                            <select id="jobType" name="jobType">

                                <option value="">
                                    All Types
                                </option>

                                <option value="internship">
                                    Internship
                                </option>

                                <option value="full-time">
                                    Full Time
                                </option>

                                <option value="part-time">
                                    Part Time
                                </option>

                                <option value="remote">
                                    Remote
                                </option>

                            </select>

                        </div>

                    </div>


                    <!-- Search Button -->
                    <button
                        type="submit"
                        class="search-btn">
                        Search Jobs
                    </button>

                </form>

            </div>

        </section>
        
         <!--  POPULAR SEARCHES  -->
           
        <section class="popular-searches">

            <div class="container">

                <p>Popular Searches:</p>

                <div class="search-tags">

                    <button>Frontend Developer</button>

                    <button>Web Developer</button>

                    <button>UI/UX Designer</button>

                    <button>Data Science</button>

                    <button>JavaScript Developer</button>

                </div>

            </div>

        </section>


    </main>

    
</body>
